<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editar Produto — Meu Mercadinho</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; min-height: 100vh; }

    .navbar {
      background: linear-gradient(135deg, #3b2f8f, #4a2070);
      color: #fff;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .navbar .logo { font-size: 1.1rem; font-weight: 700; }
    .btn-ghost { background: rgba(255,255,255,0.15); color: #fff; border: none; padding: 0.45rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .btn-ghost:hover { opacity: 0.85; }

    .conteudo { display: flex; justify-content: center; padding: 2rem 1.5rem; }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    .container-header {
      background: linear-gradient(135deg, #3b2f8f, #4a2070);
      padding: 1.5rem 2rem;
      color: #fff;
    }

    .container-header h2 { font-size: 1.2rem; font-weight: 700; }
    .container-header p { font-size: 0.85rem; opacity: 0.8; margin-top: 0.2rem; }

    .form { padding: 2rem; }

    .field { margin-bottom: 1.2rem; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #333;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #3b2f8f;
      box-shadow: 0 0 0 3px rgba(59,47,143,0.1);
    }

    .upload-area {
      border: 2px dashed #c5b8f5;
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      color: #888;
      font-size: 0.9rem;
      transition: border-color 0.2s, background 0.2s;
    }

    .upload-area:hover { border-color: #3b2f8f; background: #f9f7ff; color: #3b2f8f; }
    .upload-area input[type="file"] { display: none; }

    .preview {
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 0.8rem;
      display: none;
    }

    button[onclick="salvar()"] {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #3b2f8f, #4a2070);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s, transform 0.1s;
    }

    button[onclick="salvar()"]:hover { opacity: 0.92; }
    button[onclick="salvar()"]:active { transform: scale(0.98); }

    .msg {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }

    .msg.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .msg.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }

    .footer {
      text-align: center;
      padding: 1.2rem 2rem;
      border-top: 1px solid #f0f0f0;
      font-size: 0.85rem;
      color: #888;
    }

    .footer a { color: #3b2f8f; text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">🛒 Meu Mercadinho</div>
    <button class="btn-ghost" onclick="window.location.href='/pagina/produtos'">← Voltar</button>
  </nav>

  <div class="conteudo">
    <div class="container">
      <div class="container-header">
        <h2>Editar Produto</h2>
        <p>Atualize as informações do produto</p>
      </div>

      <div class="form">
        <div class="field">
          <label>Nome</label>
          <input type="text" id="nome" placeholder="Nome do produto"/>
        </div>
        <div class="field">
          <label>Preço</label>
          <input type="number" id="preco" placeholder="0.00" step="0.01"/>
        </div>
        <div class="field">
          <label>Quantidade em estoque</label>
          <input type="number" id="quantidade" placeholder="0"/>
        </div>
        <div class="field">
          <label>Imagem</label>
          <div class="upload-area" onclick="document.getElementById('arquivo').click()">
            <input type="file" id="arquivo" accept="image/*" onchange="previewImagem(event)"/>
            📷 Clique para trocar a imagem
          </div>
          <img id="preview" class="preview"/>
        </div>

        <button onclick="salvar()">Salvar alterações</button>
        <div id="msg" class="msg"></div>
      </div>

      <div class="footer">
        <a href="/pagina/produtos">← Voltar para produtos</a>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/pagina/login';

    const params = new URLSearchParams(window.location.search);
    const produtoId = params.get('id');
    let imagemAtual = '';

    async function carregarProduto() {
      try {
        const res = await fetch('http://127.0.0.1:5000/produtos/' + produtoId, { headers: { 'Authorization': token } });
        const data = await res.json();
        if (!data.erro) {
          document.getElementById('nome').value = data.nome;
          document.getElementById('preco').value = data.preco;
          document.getElementById('quantidade').value = data.quantidade;
          imagemAtual = data.imagem;
          if (data.imagem) {
            const preview = document.getElementById('preview');
            preview.src = 'http://127.0.0.1:5000/static/imagens/' + data.imagem;
            preview.style.display = 'block';
          }
        }
      } catch (e) {}
    }

    function previewImagem(event) {
      const preview = document.getElementById('preview');
      const file = event.target.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    }

    async function salvar() {
      const msg = document.getElementById('msg');
      msg.className = 'msg';

      const arquivo = document.getElementById('arquivo').files[0];
      let nomeImagem = imagemAtual;

      if (arquivo) {
        const formData = new FormData();
        formData.append('imagem', arquivo);
        const uploadRes = await fetch('http://127.0.0.1:5000/upload', { method: 'POST', body: formData });
        const uploadData = await uploadRes.json();
        if (uploadData.erro) { msg.textContent = uploadData.erro; msg.className = 'msg error'; return; }
        nomeImagem = uploadData.imagem;
      }

      const dados = {
        nome: document.getElementById('nome').value,
        preco: parseFloat(document.getElementById('preco').value),
        quantidade: parseInt(document.getElementById('quantidade').value),
        imagem: nomeImagem
      };

      try {
        const res = await fetch('http://127.0.0.1:5000/produtos/' + produtoId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': token },
          body: JSON.stringify(dados)
        });
        const data = await res.json();
        if (data.erro) {
          msg.textContent = data.erro;
          msg.className = 'msg error';
        } else {
          msg.textContent = 'Produto atualizado com sucesso!';
          msg.className = 'msg success';
          setTimeout(() => window.location.href = '/pagina/produtos', 2000);
        }
      } catch (e) {
        msg.textContent = 'Erro ao conectar com o servidor.';
        msg.className = 'msg error';
      }
    }

    carregarProduto();
  </script>
</body>
</html>
