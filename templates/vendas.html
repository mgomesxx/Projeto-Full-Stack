<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vendas — Meu Mercadinho</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; min-height: 100vh; }

    .navbar {
      background: linear-gradient(135deg, #3b2f8f, #4a2070);
      color: #fff;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .navbar .logo { font-size: 1.1rem; font-weight: 700; }
    .navbar-btns { display: flex; gap: 0.5rem; }
    .btn-ghost { background: rgba(255,255,255,0.15); color: #fff; border: none; padding: 0.45rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .btn-ghost:hover { opacity: 0.85; }

    .conteudo { padding: 1.5rem; max-width: 900px; margin: 0 auto; }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #3b2f8f, #4a2070);
      padding: 1rem 1.5rem;
      color: #fff;
    }

    .card-header h3 { font-size: 1rem; font-weight: 700; }
    .card-header p { font-size: 0.8rem; opacity: 0.8; margin-top: 0.2rem; }

    .card-body { padding: 1.5rem; }

    .field { margin-bottom: 1.2rem; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    select, input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #333;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #3b2f8f;
      box-shadow: 0 0 0 3px rgba(59,47,143,0.1);
    }

    .desconto-info {
      background: #f0eeff;
      border: 1px solid #c5b8f5;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      color: #3b2f8f;
      font-weight: 600;
      margin-bottom: 1rem;
      display: none;
    }

    .btn-registrar {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #3b2f8f, #4a2070);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-registrar:hover { opacity: 0.92; }

    .msg {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }

    .msg.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .msg.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }

    table { width: 100%; border-collapse: collapse; }
    thead { background: #f9f7ff; }
    th { padding: 0.8rem 1rem; text-align: left; font-size: 0.8rem; font-weight: 700; color: #3b2f8f; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid #e0e0e0; }
    td { padding: 0.8rem 1rem; font-size: 0.9rem; color: #333; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #f9f7ff; }

    .badge-desconto { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .btn-inativar-venda { padding: 0.35rem 0.8rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; background: #fef2f2; color: #991b1b; transition: opacity 0.2s; }
    .btn-inativar-venda:hover { opacity: 0.8; }

    .vazio { text-align: center; padding: 2rem; color: #888; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">🛒 Meu Mercadinho</div>
    <div class="navbar-btns">
      <button class="btn-ghost" onclick="window.location.href='/pagina/produtos'">Produtos</button>
      <button class="btn-ghost" onclick="window.location.href='/pagina/dashboard'">Dashboard</button>
    </div>
  </nav>

  <div class="conteudo">
    <div class="card">
      <div class="card-header">
        <h3>Registrar Nova Venda</h3>
        <p>Selecione o produto e a quantidade</p>
      </div>
      <div class="card-body">
        <div class="field">
          <label>Produto</label>
          <select id="produto_id" onchange="mostrarDesconto()">
            <option value="">Selecione um produto</option>
          </select>
        </div>
        <div class="field">
          <label>Quantidade</label>
          <input type="number" id="quantidade" placeholder="0" min="1" oninput="mostrarDesconto()"/>
        </div>
        <div class="desconto-info" id="desconto_info"></div>
        <button class="btn-registrar" onclick="registrarVenda()">Registrar Venda</button>
        <div id="msg" class="msg"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Histórico de Vendas</h3>
        <p>Apenas vendas ativas são exibidas</p>
      </div>
      <div class="card-body" style="padding: 0;">
        <table>
          <thead>
            <tr><th>Produto</th><th>Qtd</th><th>Preço Unit.</th><th>Desconto</th><th>Total</th><th>Ação</th></tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/pagina/login';

    async function carregarProdutos() {
      const res = await fetch('http://127.0.0.1:5000/produtos', { headers: { 'Authorization': token } });
      const data = await res.json();
      const select = document.getElementById('produto_id');
      select.innerHTML = '<option value="">Selecione um produto</option>';
      data.filter(p => p.status === 'Ativo').forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.nome + ' (estoque: ' + p.quantidade + ')';
        select.appendChild(opt);
      });
    }

    function mostrarDesconto() {
      const qtd = parseInt(document.getElementById('quantidade').value) || 0;
      const info = document.getElementById('desconto_info');
      if (qtd >= 10) {
        info.textContent = '🎉 Desconto de 10% será aplicado!';
        info.style.display = 'block';
      } else if (qtd >= 5) {
        info.textContent = '🎉 Desconto de 5% será aplicado!';
        info.style.display = 'block';
      } else {
        info.style.display = 'none';
      }
    }

    async function registrarVenda() {
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      const dados = {
        produto_id: document.getElementById('produto_id').value,
        quantidade: parseInt(document.getElementById('quantidade').value)
      };
      try {
        const res = await fetch('http://127.0.0.1:5000/vendas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': token },
          body: JSON.stringify(dados)
        });
        const data = await res.json();
        if (data.erro) {
          msg.textContent = data.erro;
          msg.className = 'msg error';
        } else {
          msg.textContent = 'Venda registrada com sucesso!';
          msg.className = 'msg success';
          document.getElementById('quantidade').value = '';
          document.getElementById('desconto_info').style.display = 'none';
          carregarProdutos();
          carregarVendas();
        }
      } catch (e) {
        msg.textContent = 'Erro ao conectar com o servidor.';
        msg.className = 'msg error';
      }
    }

    async function inativarVenda(id) {
      if (!confirm('Deseja inativar esta venda? O estoque será devolvido.')) return;
      const res = await fetch('http://127.0.0.1:5000/vendas/' + id + '/inativar', {
        method: 'PUT', headers: { 'Authorization': token }
      });
      const data = await res.json();
      if (data.mensagem) { carregarVendas(); carregarProdutos(); }
    }

    async function carregarVendas() {
      const tabela = document.getElementById('tabela');
      try {
        const res = await fetch('http://127.0.0.1:5000/vendas', { headers: { 'Authorization': token } });
        const data = await res.json();
        if (!data || data.length === 0) {
          tabela.innerHTML = '<tr><td colspan="6" class="vazio">Nenhuma venda registrada.</td></tr>';
          return;
        }
        tabela.innerHTML = data.map(v => `
          <tr>
            <td>${v.nome_produto}</td>
            <td>${v.quantidade}</td>
            <td>R$ ${parseFloat(v.preco_unitario).toFixed(2)}</td>
            <td>${v.desconto !== '0%' ? `<span class="badge-desconto">${v.desconto}</span>` : '-'}</td>
            <td><strong>R$ ${parseFloat(v.total).toFixed(2)}</strong></td>
            <td><button class="btn-inativar-venda" onclick="inativarVenda('${v.id}')">Inativar</button></td>
          </tr>
        `).join('');
      } catch (e) {
        tabela.innerHTML = '<tr><td colspan="6" class="vazio">Erro ao carregar vendas.</td></tr>';
      }
    }

    carregarProdutos();
    carregarVendas();
  </script>
</body>
</html>
