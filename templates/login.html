<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Meu Mercadinho</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #3b2f8f, #4a2070);
      padding: 2rem;
      text-align: center;
      color: #fff;
    }

    .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .header p { font-size: 0.85rem; opacity: 0.8; margin-top: 0.3rem; }

    .form { padding: 2rem; }

    .field { margin-bottom: 1.2rem; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #333;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #3b2f8f;
      box-shadow: 0 0 0 3px rgba(59,47,143,0.1);
    }

    button {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #3b2f8f, #4a2070);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.98); }

    .msg {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }

    .msg.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .msg.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }

    .footer {
      text-align: center;
      padding: 1.2rem 2rem;
      border-top: 1px solid #f0f0f0;
      font-size: 0.85rem;
      color: #888;
    }

    .footer a { color: #3b2f8f; text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Meu Mercadinho</h1>
      <p>Acesse sua conta</p>
    </div>

    <div class="form">
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com"/>
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="••••••••"/>
      </div>

      <button onclick="login()">Entrar</button>
      <div id="msg" class="msg"></div>
    </div>

    <div class="footer">
      Não tem conta? <a href="/pagina/cadastro">Cadastrar</a>
    </div>
  </div>

  <script>
    async function login() {
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      const dados = {
        email: document.getElementById('email').value,
        senha: document.getElementById('senha').value
      };
      try {
        const res = await fetch('http://127.0.0.1:5000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });
        const data = await res.json();
        if (data.erro) {
          msg.textContent = data.erro;
          msg.className = 'msg error';
        } else {
          localStorage.setItem('token', data.token);
          msg.textContent = 'Login realizado com sucesso!';
          msg.className = 'msg success';
          setTimeout(() => window.location.href = '/pagina/produtos', 2000);
        }
      } catch (e) {
        msg.textContent = 'Erro ao conectar com o servidor.';
        msg.className = 'msg error';
      }
    }
  </script>
</body>
</html>
