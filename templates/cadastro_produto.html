<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro de Produto</title>
  <style>
    body { font-family: Arial, sans-serif; background: #ede9f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1.5rem; }
    .form-box { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    .form-box h2 { background: #160d69; color: #fff; margin: -2rem -2rem 1.5rem -2rem; padding: 1.2rem 2rem; border-radius: 8px 8px 0 0; text-align: center; font-size: 1.2rem; }
    label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #555; }
    input[type="text"], input[type="number"] { width: 100%; padding: 0.6rem 0.8rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; box-sizing: border-box; }
    input:focus { outline: none; border-color: #160d69; }
    .upload-area { border: 2px dashed #ccc; border-radius: 4px; padding: 1rem; text-align: center; margin-bottom: 1rem; cursor: pointer; color: #888; font-size: 0.9rem; }
    .upload-area:hover { border-color: #160d69; color: #160d69; }
    .upload-area input[type="file"] { display: none; }
    .preview { width: 100%; max-height: 150px; object-fit: cover; border-radius: 4px; margin-bottom: 1rem; display: none; }
    button { width: 100%; padding: 0.7rem; background: #160d69; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #160d69; }
    .msg { margin-top: 1rem; padding: 0.6rem; border-radius: 4px; text-align: center; font-size: 0.9rem; display: none; }
    .msg.success { background: #d4edda; color: #155724; display: block; }
    .msg.error { background: #f8d7da; color: #721c24; display: block; }
    .link { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #555; }
    .link a { color: #160d69; text-decoration: none; }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Cadastro de Produto</h2>

    <label>Nome</label>
    <input type="text" id="nome" placeholder="Nome do produto"/>

    <label>Preço</label>
    <input type="number" id="preco" placeholder="0.00" step="0.01"/>

    <label>Quantidade em estoque</label>
    <input type="number" id="quantidade" placeholder="0"/>

    <label>Imagem</label>
    <div class="upload-area" onclick="document.getElementById('arquivo').click()">
      <input type="file" id="arquivo" accept="image/*" onchange="previewImagem(event)"/>
      📷 Clique para selecionar uma imagem
    </div>
    <img id="preview" class="preview"/>

    <button onclick="cadastrar()">Cadastrar Produto</button>
    <div id="msg" class="msg"></div>

    <p class="link"><a href="/pagina/produtos">← Voltar para produtos</a></p>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/pagina/login';

    function previewImagem(event) {
      const preview = document.getElementById('preview');
      const file = event.target.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    }

    async function cadastrar() {
      const msg = document.getElementById('msg');
      msg.className = 'msg';

      const arquivo = document.getElementById('arquivo').files[0];
      let nomeImagem = '';

      if (arquivo) {
        const formData = new FormData();
        formData.append('imagem', arquivo);
        const uploadRes = await fetch('http://127.0.0.1:5000/upload', {
          method: 'POST',
          body: formData
        });
        const uploadData = await uploadRes.json();
        if (uploadData.erro) {
          msg.textContent = uploadData.erro;
          msg.className = 'msg error';
          return;
        }
        nomeImagem = uploadData.imagem;
      }

      const dados = {
        nome: document.getElementById('nome').value,
        preco: parseFloat(document.getElementById('preco').value),
        quantidade: parseInt(document.getElementById('quantidade').value),
        imagem: nomeImagem
      };

      try {
        const res = await fetch('http://127.0.0.1:5000/produtos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': token },
          body: JSON.stringify(dados)
        });
        const data = await res.json();
        if (data.erro) {
          msg.textContent = data.erro;
          msg.className = 'msg error';
        } else {
          msg.textContent = 'Produto cadastrado com sucesso!';
          msg.className = 'msg success';
          setTimeout(() => window.location.href = '/pagina/produtos', 2000);
        }
      } catch (e) {
        msg.textContent = 'Erro ao conectar com o servidor.';
        msg.className = 'msg error';
      }
    }
  </script>
</body>
</html>
