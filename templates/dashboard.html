<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Meu Mercadinho</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; min-height: 100vh; }

    .navbar {
      background: linear-gradient(135deg, #3b2f8f, #4a2070);
      color: #fff;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .navbar .logo { font-size: 1.1rem; font-weight: 700; }
    .navbar-btns { display: flex; gap: 0.5rem; }
    .btn-ghost { background: rgba(255,255,255,0.15); color: #fff; border: none; padding: 0.45rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .btn-ghost:hover { opacity: 0.85; }

    .conteudo { padding: 1.5rem; max-width: 900px; margin: 0 auto; }

    .page-title { font-size: 1.3rem; font-weight: 700; color: #222; margin-bottom: 1.2rem; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .card-stat {
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-left: 4px solid #3b2f8f;
    }

    .card-stat .label { font-size: 0.75rem; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
    .card-stat .valor { font-size: 2rem; font-weight: 800; color: #3b2f8f; }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #3b2f8f, #4a2070);
      padding: 1rem 1.5rem;
      color: #fff;
    }

    .card-header h3 { font-size: 1rem; font-weight: 700; }
    .card-header p { font-size: 0.8rem; opacity: 0.8; margin-top: 0.2rem; }

    table { width: 100%; border-collapse: collapse; }
    thead { background: #f9f7ff; }
    th { padding: 0.8rem 1rem; text-align: left; font-size: 0.8rem; font-weight: 700; color: #3b2f8f; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid #e0e0e0; }
    td { padding: 0.8rem 1rem; font-size: 0.9rem; color: #333; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9f7ff; }

    .badge-desconto { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .vazio { text-align: center; padding: 2rem; color: #888; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">🛒 Meu Mercadinho</div>
    <div class="navbar-btns">
      <button class="btn-ghost" onclick="window.location.href='/pagina/produtos'">Produtos</button>
      <button class="btn-ghost" onclick="window.location.href='/pagina/vendas'">Vendas</button>
      <button class="btn-ghost" onclick="sair()">Sair</button>
    </div>
  </nav>

  <div class="conteudo">
    <p class="page-title">Dashboard</p>

    <div class="cards">
      <div class="card-stat">
        <div class="label">Itens em Estoque</div>
        <div class="valor" id="total_estoque">-</div>
      </div>
      <div class="card-stat">
        <div class="label">Total de Vendas</div>
        <div class="valor" id="total_vendas">-</div>
      </div>
      <div class="card-stat">
        <div class="label">Valor Total Vendido</div>
        <div class="valor" id="valor_vendido">-</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Histórico de Vendas</h3>
        <p>Resumo das vendas ativas</p>
      </div>
      <table>
        <thead>
          <tr><th>Produto</th><th>Qtd</th><th>Preço Unit.</th><th>Desconto</th><th>Total</th></tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/pagina/login';

    async function carregarDashboard() {
      try {
        const res = await fetch('http://127.0.0.1:5000/dashboard', { headers: { 'Authorization': token } });
        const data = await res.json();

        document.getElementById('total_estoque').textContent = data.quantidade_produtos_estoque;
        document.getElementById('total_vendas').textContent = data.total_vendas;
        document.getElementById('valor_vendido').textContent = 'R$ ' + parseFloat(data.valor_total_vendido).toFixed(2);

        const tabela = document.getElementById('tabela');
        if (!data.vendas || data.vendas.length === 0) {
          tabela.innerHTML = '<tr><td colspan="5" class="vazio">Nenhuma venda registrada.</td></tr>';
          return;
        }
        tabela.innerHTML = data.vendas.map(v => `
          <tr>
            <td>${v.nome_produto}</td>
            <td>${v.quantidade}</td>
            <td>R$ ${parseFloat(v.preco_unitario).toFixed(2)}</td>
            <td>${v.desconto !== '0%' ? `<span class="badge-desconto">${v.desconto}</span>` : '-'}</td>
            <td><strong>R$ ${parseFloat(v.total).toFixed(2)}</strong></td>
          </tr>
        `).join('');
      } catch (e) {
        console.error('Erro:', e);
      }
    }

    function sair() { localStorage.removeItem('token'); window.location.href = '/pagina/login'; }

    carregarDashboard();
  </script>
</body>
</html>
