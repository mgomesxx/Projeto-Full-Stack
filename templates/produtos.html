<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Produtos — Meu Mercadinho</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; min-height: 100vh; }

    .navbar {
      background: linear-gradient(135deg, #3b2f8f, #4a2070);
      color: #fff;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .navbar .logo { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }

    .navbar-btns { display: flex; gap: 0.5rem; }

    .btn {
      padding: 0.45rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }
    .btn-white { background: #fff; color: #3b2f8f; }
    .btn-ghost { background: rgba(255,255,255,0.15); color: #fff; }

    .conteudo { padding: 1.5rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1.2rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card .sem-foto {
      width: 100%;
      height: 160px;
      background: #f0eeff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #c5b8f5;
    }

    .card-info { padding: 1rem; flex: 1; }
    .card-info .nome { font-weight: 700; font-size: 0.95rem; color: #222; margin-bottom: 0.3rem; }
    .card-info .preco { color: #3b2f8f; font-size: 1.1rem; font-weight: 700; margin-bottom: 0.3rem; }
    .card-info .estoque { font-size: 0.8rem; color: #888; margin-bottom: 0.6rem; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge.ativo { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .badge.inativo { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    .card-acoes {
      display: flex;
      gap: 0.5rem;
      padding: 0.8rem 1rem;
      border-top: 1px solid #f0f0f0;
    }

    .btn-acao {
      flex: 1;
      padding: 0.45rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .btn-acao:hover { opacity: 0.85; }
    .btn-editar { background: #f0eeff; color: #3b2f8f; }
    .btn-inativar { background: #fef2f2; color: #991b1b; }
    .btn-ativar { background: #f0fdf4; color: #166534; }

    .vazio {
      text-align: center;
      padding: 3rem;
      color: #888;
      grid-column: 1/-1;
    }

    .msg { padding: 0.75rem 1rem; border-radius: 8px; text-align: center; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    .msg.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">🛒 Meu Mercadinho</div>
    <div class="navbar-btns">
      <button class="btn btn-white" onclick="window.location.href='/pagina/cadastro_produto'">+ Novo Produto</button>
      <button class="btn btn-ghost" onclick="window.location.href='/pagina/vendas'">Vendas</button>
      <button class="btn btn-ghost" onclick="window.location.href='/pagina/dashboard'">Dashboard</button>
      <button class="btn btn-ghost" onclick="sair()">Sair</button>
    </div>
  </nav>

  <div class="conteudo">
    <div id="msg" class="msg"></div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/pagina/login';

    async function carregarProdutos() {
      const msg = document.getElementById('msg');
      try {
        const res = await fetch('http://127.0.0.1:5000/produtos', { headers: { 'Authorization': token } });
        const data = await res.json();
        if (data.erro) { msg.textContent = data.erro; msg.className = 'msg error'; return; }
        const grid = document.getElementById('grid');
        if (data.length === 0) {
          grid.innerHTML = '<div class="vazio">Nenhum produto cadastrado. Clique em "+ Novo Produto" para começar!</div>';
          return;
        }
        grid.innerHTML = data.map(p => `
          <div class="card">
            ${p.imagem
              ? `<img src="http://127.0.0.1:5000/static/imagens/${p.imagem}" alt="${p.nome}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                 <div class="sem-foto" style="display:none">🛍️</div>`
              : `<div class="sem-foto">🛍️</div>`}
            <div class="card-info">
              <div class="nome">${p.nome}</div>
              <div class="preco">R$ ${parseFloat(p.preco).toFixed(2)}</div>
              <div class="estoque">Estoque: ${p.quantidade} un.</div>
              <span class="badge ${p.status === 'Ativo' ? 'ativo' : 'inativo'}">${p.status}</span>
            </div>
            <div class="card-acoes">
              <button class="btn-acao btn-editar" onclick="editar('${p.id}')">Editar</button>
              ${p.status === 'Ativo'
                ? `<button class="btn-acao btn-inativar" onclick="inativar('${p.id}')">Inativar</button>`
                : `<button class="btn-acao btn-ativar" onclick="ativar('${p.id}')">Ativar</button>`}
            </div>
          </div>
        `).join('');
      } catch (e) {
        msg.textContent = 'Erro ao carregar produtos.';
        msg.className = 'msg error';
      }
    }

    function editar(id) { window.location.href = '/pagina/editar_produto?id=' + id; }

    async function inativar(id) {
      if (!confirm('Deseja inativar este produto?')) return;
      await fetch('http://127.0.0.1:5000/produtos/' + id + '/inativar', { method: 'PUT', headers: { 'Authorization': token } });
      carregarProdutos();
    }

    async function ativar(id) {
      if (!confirm('Deseja ativar este produto?')) return;
      await fetch('http://127.0.0.1:5000/produtos/' + id + '/ativar', { method: 'PUT', headers: { 'Authorization': token } });
      carregarProdutos();
    }

    function sair() { localStorage.removeItem('token'); window.location.href = '/pagina/login'; }

    carregarProdutos();
  </script>
</body>
</html>
